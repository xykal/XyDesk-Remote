# XyDesk Remote — build configuration (consumed by build.gradle)
#
# M0 defaults: 2 ABIs, single universal APK, full codec stack.
# Keystore defaults point at the Android debug keystore — only use for
# debug builds. Release signing is wired in M5 (see PLAN.md).

COMPILE_API=37
TARGET_API=37
MIN_API=29
TOOLS_VERSION=37.0.0
NDK_VERSION=29.0.13113456
CMAKE_VERSION=4.1.2

ABI_FILTERS=arm64-v8a;x86_64
SPLIT_ARCHITECTURES=arm64-v8a;x86_64
SPLIT_ENABLED=false
BUILD_UNIVERSAL=true

VERSION_NAME=0.1.0-m0
VERSION_CODE=1

# FreeRDP superbuild options (see client/Android/cmake/ExternalDeps.cmake)
CMAKE_ARGUMENTS=-DWITH_FFMPEG=ON;-DWITH_OPENH264=ON;-DWITH_OPUS=ON;-DWITH_WEBP=ON;-DWITH_JPEG=ON;-DWITH_PNG=ON;-DWITH_CJSON=ON;-DWITH_OPENSSL=ON
