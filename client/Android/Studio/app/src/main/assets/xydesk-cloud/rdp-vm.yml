name: XyDesk RDP Setup

# Dipush + di-trigger otomatis oleh app XyDesk Remote (fitur Cloud RDP).
# Menyiapkan self-hosted Windows runner milik USER (bukan akun developer):
#   - RDP on + firewall
#   - join Tailscale (key dari input app, fallback env runner)
#   - user RDP + password (input app / auto-generate kuat)
#   - publish kredensial ter-enskripsi (pubkey.pem dari app) sbg artifact
#
# Label runner: 'xydesk-win' (self-hosted, Windows, milik user sendiri).
# JANGAN ganti ke windows-latest (GitHub-hosted) — melanggar ketentuan
# pemakaian Actions dan bikin akun GitHub kena suspend.
on:
  workflow_dispatch:
    inputs:
      rdpuser:
        description: 'Nama user RDP (default: xydesk)'
        required: false
        default: 'xydesk'
      rdppass:
        description: 'Password RDP (kosongkan = auto-generate kuat)'
        required: false
        default: ''
      tskey:
        description: 'Tailscale auth key (kosongkan = pakai env runner XYDESK_TAILSCALE_AUTH_KEY)'
        required: false
        default: ''

jobs:
  setup:
    runs-on: [xydesk-win]
    steps:
      - name: Run setup
        shell: pwsh
        env:
          XYDESK_RDP_USER: ${{ inputs.rdpuser }}
          XYDESK_RDP_PASS: ${{ inputs.rdppass }}
          XYDESK_TSKEY: ${{ inputs.tskey }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File setup/setup-windows.ps1
      - name: Upload RDP credentials (ter-enskripsi)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rdp-credentials
          path: C:\ProgramData\xydesk\rdp-credentials.enc
