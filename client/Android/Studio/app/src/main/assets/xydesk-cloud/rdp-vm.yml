name: XyDesk RDP Setup

# Dipush + di-trigger otomatis oleh app XyDesk Remote (fitur Cloud RDP).
# Menyiapkan self-hosted Windows runner milik USER (bukan akun developer):
#
#   fase 'prepare' : generate pasangan kunci host (sekali per mesin),
#                    upload public key sbg artifact 'host-pubkey'.
#                    App lalu enkripsi rahasia (user/pass/tskey) ke kunci itu.
#   fase 'setup'   : dekripsi setup/secrets.enc dgn kunci privat host,
#                    RDP on + firewall, join Tailscale, buat user RDP,
#                    publish kredensial ter-enskripsi (pubkey.pem dr app)
#                    sbg artifact 'rdp-credentials'.
#
# Repo bisa PUBLIC aman: rahasia TIDAK pernah lewat input workflow / log —
# hanya ciphertext di setup/secrets.dec. Input workflow cuma 'phase'.
#
# Label runner: 'xydesk-win' (self-hosted, Windows, milik user sendiri).
# JANGAN ganti ke windows-latest (GitHub-hosted) — melanggar ketentuan
# pemakaian Actions dan bikin akun GitHub kena suspend.
on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'prepare (generate kunci host) atau setup (install RDP)'
        required: true
        default: 'setup'

jobs:
  setup:
    runs-on: [xydesk-win]
    steps:
      - name: Run setup script
        shell: pwsh
        env:
          XYDESK_PHASE: ${{ inputs.phase }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File setup/setup-windows.ps1
      - name: Upload host public key (phase prepare)
        if: inputs.phase == 'prepare'
        uses: actions/upload-artifact@v4
        with:
          name: host-pubkey
          path: C:\ProgramData\xydesk\host-pubkey.pem
      - name: Upload RDP credentials (phase setup, ter-enskripsi)
        if: inputs.phase == 'setup'
        uses: actions/upload-artifact@v4
        with:
          name: rdp-credentials
          path: C:\ProgramData\xydesk\rdp-credentials.enc
