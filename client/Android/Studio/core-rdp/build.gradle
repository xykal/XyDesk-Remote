// =============================================================
// :core-rdp — M1: lapis Kotlin di atas :freeRDPCore
// SessionManager (state machine) + ConnectionProfile + RdpUri.
// Tidak menyentuh UI — hanya orkestrasi sesi + event.
// =============================================================
apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'id.xydesk.remote.core'
    compileSdkVersion rootProject.ext.compileApi
    buildToolsVersion rootProject.ext.toolsVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minApi
        targetSdkVersion rootProject.ext.targetApi
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {
    // 'api': consumer (app, features-*) boleh refer LibFreeRDP/GlobalApp
    api project(':freeRDPCore')

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
}
