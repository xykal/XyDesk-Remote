name: Web Worker checks

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-tests:
    name: Cloudflare Worker unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check Worker JavaScript syntax
        run: |
          node --check cloudflare/worker.mjs
          node --check cloudflare/worker.test.mjs
      - name: Run Worker route and compatibility tests
        run: node --test cloudflare/worker.test.mjs
