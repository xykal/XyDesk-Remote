name: Bersihkan Actions

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  workflow_run:
    workflows: ['Build APK']
    types: [completed]

permissions:
  actions: write
  contents: write

concurrency:
  group: cleanup
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Bersihkan run lama, artifacts, dan cache usang
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: '2'
        run: |
          set -eu
          repo="$GITHUB_REPOSITORY"
          for art in $(gh api --paginate "repos/$repo/actions/artifacts" -q '.artifacts[].id'); do
            gh api -X DELETE "repos/$repo/actions/artifacts/$art" </dev/null >/dev/null || true
          done
          for wf in $(gh api --paginate "repos/$repo/actions/workflows" -q '.workflows[].id'); do
            for run in $(gh api --paginate "repos/$repo/actions/workflows/$wf/runs?status=completed&per_page=100" \
              -q '.workflow_runs[].id' | tail -n +"$((KEEP + 1))"); do
              gh api -X DELETE "repos/$repo/actions/runs/$run" </dev/null >/dev/null || true
            done
          done
          # Hanya buang rilis/tag yang LEBIH TUA dari rilis terbaru.
          # Kenapa: job ini bisa selesai saat tag baru sudah di-push sementara job
          # rilisnya masih berjalan — tag itu yang justru harus dipertahankan.
          # (Kejadian nyata: tag v0.5.29 terhapus di sini sebelum rilisnya terbit.)
          latest_tag=$(gh api "repos/$repo/releases?per_page=1" -q '.[0].tag_name' 2>/dev/null || echo "")
          if [ -n "$latest_tag" ]; then
            lebih_tua_dari() {
              [ -n "$1" ] || return 1
              [ "$1" = "$2" ] && return 1
              [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | head -n1)" = "$1" ]
            }
            for row in $(gh api --paginate "repos/$repo/releases" -q '.[] | "\(.id):\(.tag_name)"'); do
              rid="${row%%:*}"; rtag="${row#*:}"
              if lebih_tua_dari "$rtag" "$latest_tag"; then
                gh api -X DELETE "repos/$repo/releases/$rid" </dev/null >/dev/null || true
              fi
            done
            for tag in $(gh api --paginate "repos/$repo/tags" -q '.[].name'); do
              if lebih_tua_dari "$tag" "$latest_tag"; then
                gh api -X DELETE "repos/$repo/git/refs/tags/$tag" </dev/null >/dev/null || true
              fi
            done
          fi
