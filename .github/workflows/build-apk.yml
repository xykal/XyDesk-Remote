name: Build APK

# XyDesk Remote — CI/CD
#  - push ke main        -> compile gate + debug per-ABI (kecuali commit [skip-debug])
#  - tag v* / manual     -> build RELEASE (R8 + signing resmi, per-ABI) + GitHub Release
#  - manual (dispatch)   -> build debug atau release
#
# Signing key tidak pernah dibuat/diunggah oleh workflow ini. Buat dan simpan
# keystore di mesin tepercaya; masukkan nilainya ke repository Actions secrets.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      job:
        description: "Job manual"
        type: choice
        options: [ debug, release ]
        default: debug

# Satu run per ref pada satu waktu: push beruntun ke main (atau re-tag)
# membatalkan run lama, bukan menumpuk runner 20-30 menit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default paling sempit: cuma baca. Yang butuh nulis (bikin GitHub Release)
# menaikkan sendiri di level job — bukan di level workflow.
permissions:
  contents: read

env:
  GRADLE_PROJECT_DIR: client/Android/Studio

jobs:
  # ------------------------------------------------------------------
  # GATE CEPAT: jalan di SETIAP push, termasuk commit yang sudah bertag.
  # ------------------------------------------------------------------
  # Kenapa ada: job "Debug per-ABI" di bawah melewati seluruh langkahnya
  # kalau commit yang di-push sudah punya tag rilis (lihat langkah
  # "tagcheck"). Alur rilis XyDesk = push main + tag sekaligus, jadi run
  # main tampak hijau tanpa meng-compile apa pun; error Kotlin baru
  # ketahuan di run tag setelah ~23 menit membangun native dulu.
  # Job ini menutup celah itu: tanpa NDK/CMake, tanpa tagcheck, cuma
  # compile Kotlin + unit test JVM.
  compile-check:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    name: Gate compile Kotlin (cepat, tanpa native)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK (tanpa NDK & CMake)
        run: |
          set -eux
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/clt.zip
          unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-37.2" "build-tools;37.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Unit test JVM (core-rdp + IME + app UI)
        working-directory: client/Android/Studio
        run: ./gradlew --stacktrace --no-daemon :core-rdp:testDebugUnitTest :freeRDPCore:testDebugUnitTest :app:testDebugUnitTest
      - name: Compile Kotlin (app + core-rdp)
        working-directory: client/Android/Studio
        run: ./gradlew --stacktrace --no-daemon :app:compileDebugKotlin

  # ------------------------------------------------------------------
  # DEBUG per-ABI (tiap push ke main; commit [skip-debug] khusus melewati job ini)
  # ------------------------------------------------------------------
  build-debug:
    if: ${{ (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && !contains(github.event.head_commit.message, '[skip-debug]')) || (github.event_name == 'workflow_dispatch' && inputs.job == 'debug') }}
    name: Debug per-ABI (armv7 + arm64 + x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Lewati kalau commit ini sudah punya tag rilis
        id: tagcheck
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if git ls-remote --tags origin | awk -v s="$GITHUB_SHA" '$1 == s { found = 1 } END { exit !found }'; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$GITHUB_SHA sudah bertag — run rilis di sha ini yang dipakai, debug dilewati."
          fi
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
        if: steps.tagcheck.outputs.tagged != 'true'
      - name: Cache Android SDK (NDK & CMake)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: steps.tagcheck.outputs.tagged != 'true'
        with:
          path: |
            $HOME/android-sdk/ndk/29.0.13113456
            $HOME/android-sdk/cmake/4.1.2
          key: android-ndk-29.0.13113456-cmake-4.1.2
      - name: Install Android SDK (cmdline-tools + components)
        if: steps.tagcheck.outputs.tagged != 'true'
        run: |
          set -eux
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/clt.zip
          unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-37.2" "build-tools;37.0.0" \
            "cmake;4.1.2" "ndk;29.0.13113456"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          # runner punya ANDROID_SDK_ROOT bawaan — samakan agar AGP tidak gagal
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Host dependencies (pkg-config + nasm)
        if: steps.tagcheck.outputs.tagged != 'true'
        run: |
          sudo apt-get update -qq
          # pkg-config: disyaratkan ExternalFreeRDP.cmake
          # nasm: OpenH264 mem-compile cpuid.asm untuk target x86/x86_64
          sudo apt-get install -y -qq pkg-config nasm
      - name: Unit test JVM (core-rdp)
        if: steps.tagcheck.outputs.tagged != 'true'
        working-directory: client/Android/Studio
        run: ./gradlew --stacktrace --no-daemon :core-rdp:testDebugUnitTest
      - name: Gradle assembleDebug (per ABI)
        if: steps.tagcheck.outputs.tagged != 'true'
        working-directory: client/Android/Studio
        run: ./gradlew --stacktrace --no-daemon assembleDebug
      - name: List build outputs
        if: steps.tagcheck.outputs.tagged != 'true'
        working-directory: client/Android/Studio
        run: find app/build/outputs -name "*.apk" -exec ls -lh {} \;
      - name: Upload debug APKs (per ABI)
        if: steps.tagcheck.outputs.tagged != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xydesk-remote-debug-per-abi
          path: client/Android/Studio/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  # ------------------------------------------------------------------
  # RELEASE per-ABI (R8 + signing resmi) + GitHub Release
  # Trigger: tag v* (otomatis) atau manual 'release'
  # ------------------------------------------------------------------
  build-release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.job == 'release' && github.ref == 'refs/heads/main') }}
    name: Release per-ABI (R8 + signed) + GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 400
    # Build/signing hanya memerlukan baca; publikasi dipisah ke job sempit.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Ensure release tag points to a commit on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::Release tags must point to a commit reachable from main."
            exit 1
          fi
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache Android SDK (NDK & CMake)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            $HOME/android-sdk/ndk/29.0.13113456
            $HOME/android-sdk/cmake/4.1.2
          key: android-ndk-29.0.13113456-cmake-4.1.2
      - name: Install Android SDK (cmdline-tools + components)
        run: |
          set -eux
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/clt.zip
          unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-37.2" "build-tools;37.0.0" \
            "cmake;4.1.2" "ndk;29.0.13113456"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Host dependencies (pkg-config + nasm)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config nasm
      - name: Restore release keystore dari secret
        env:
          RELEASE_KEY_BASE64: ${{ secrets.RELEASE_KEY_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEY_BASE64" ] || [ -z "$RELEASE_KEY_ALIAS" ] || \
             [ -z "$RELEASE_KEY_PASSWORD" ] || [ -z "$RELEASE_STORE_PASSWORD" ]; then
            echo "::error::Secret signing release belum lengkap. Siapkan keystore di mesin tepercaya dan periksa secrets signing yang diwajibkan."
            exit 1
          fi
          umask 077
          printf '%s' "$RELEASE_KEY_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.keystore"
          test -s "$GITHUB_WORKSPACE/release.keystore"
      # Fail cepat: kalau Kotlin tidak compile, batalkan SEBELUM membangun
      # native (dulu: 23 menit native dulu, baru ketahuan error Kotlin).
      - name: "Gate: compileReleaseKotlin sebelum build native"
        working-directory: client/Android/Studio
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: ./gradlew --stacktrace --no-daemon :app:compileReleaseKotlin
      - name: Gradle assembleRelease (R8 + signed, per ABI)
        working-directory: client/Android/Studio
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: ./gradlew --stacktrace --no-daemon assembleRelease
      - name: Verifikasi signature setiap ABI (apksigner)
        working-directory: client/Android/Studio
        run: |
          set -euo pipefail
          found=0
          for apk in app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            found=1
            echo "Verifying $apk"
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk"
          done
          [ "$found" -eq 1 ] || { echo "Tidak ada APK release"; exit 1; }
      - name: Upload signed APKs for publishing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xydesk-remote-release-apks
          path: client/Android/Studio/app/build/outputs/apk/release/*.apk
          retention-days: 3
      - name: Hapus material signing sementara
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/release.keystore"

  # Token write hanya tersedia pada job publikasi; proses build/native tidak
  # mendapat izin membuat atau mengubah GitHub Release.
  publish-release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: build-release
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed APKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: xydesk-remote-release-apks
          path: release-apks
      - name: Buat GitHub Release (tag v*)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release-apks/*.apk
          generate_release_notes: true
