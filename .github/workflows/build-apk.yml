name: Build APK

# XyDesk Remote — CI/CD
#  - push ke main        -> compile gate + debug per-ABI (kecuali commit [skip-debug])
#  - tag v* / manual     -> build RELEASE (R8 + signing resmi, per-ABI) + GitHub Release
#  - manual (dispatch)   -> gate saja (default), atau build debug / release
#
# Signing key tidak pernah dibuat/diunggah oleh workflow ini. Buat dan simpan
# keystore di mesin tepercaya; masukkan nilainya ke repository Actions secrets.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      job:
        description: "Job manual"
        type: choice
        # 'gate' hanya menjalankan gate compile + unit test tanpa merakit APK.
        # Sebelumnya pilihan hanya debug/release, jadi tidak ada cara meminta
        # pemeriksaan cepat lewat dispatch ([skip-debug] hanya berlaku untuk push).
        options: [ gate, debug, release ]
        default: gate

# Satu run per ref pada satu waktu: push beruntun ke main (atau re-tag)
# membatalkan run lama, bukan menumpuk runner 20-30 menit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default paling sempit: cuma baca. Yang butuh nulis (bikin GitHub Release)
# menaikkan sendiri di level job — bukan di level workflow.
permissions:
  contents: read

env:
  GRADLE_PROJECT_DIR: client/Android/Studio

jobs:
  # ------------------------------------------------------------------
  # GATE CEPAT: jalan di SETIAP push, termasuk commit yang sudah bertag.
  # ------------------------------------------------------------------
  # Kenapa ada: job "Debug per-ABI" di bawah melewati seluruh langkahnya
  # kalau commit yang di-push sudah punya tag rilis (lihat langkah
  # "tagcheck"). Alur rilis XyDesk = push main + tag sekaligus, jadi run
  # main tampak hijau tanpa meng-compile apa pun; error Kotlin baru
  # ketahuan di run tag setelah ~23 menit membangun native dulu.
  # Job ini menutup celah itu: tanpa NDK/CMake, tanpa tagcheck, cuma
  # compile Kotlin + unit test JVM.
  compile-check:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    name: Gate compile Kotlin (cepat, tanpa native)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          # Cache dependensi + wrapper Gradle antar-run (permintaan pemilik
          # 2026-10-10: build harus lebih cepat, cache yang penting disimpan).
          cache: gradle
      - name: Cache Android SDK gate (platform & build-tools)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: $HOME/android-sdk
          key: android-sdk-gate-platforms-37.2-bt37.0.0
      - name: Install Android SDK (tanpa NDK & CMake)
        run: |
          set -eux
          export ANDROID_HOME="$HOME/android-sdk"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ] && \
             [ -d "$ANDROID_HOME/platforms/android-37.2" ] && \
             [ -d "$ANDROID_HOME/build-tools/37.0.0" ]; then
            echo "SDK dipulihkan dari cache — tidak perlu unduh ulang."
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/clt.zip
          unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-37.2" "build-tools;37.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Unit test JVM (core-rdp + core-pc-stream + IME + app UI)
        working-directory: client/Android/Studio
        run: ./gradlew --stacktrace --no-daemon --build-cache :core-rdp:testDebugUnitTest :core-pc-stream:testDebugUnitTest :freeRDPCore:testDebugUnitTest :app:testDebugUnitTest
      - name: Compile Kotlin (app + core-rdp)
        working-directory: client/Android/Studio
        run: ./gradlew --stacktrace --no-daemon --build-cache :app:compileDebugKotlin
      - name: Compile Windows Native C++17 Host Agent & DLLs (mingw-w64)
        run: |
          # apt di runner kadang menggantung tanpa batas waktu -> pasang timeout + retry
          export DEBIAN_FRONTEND=noninteractive
          APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 -o Acquire::ForceIPv4=true"
          # Mirror apt runner kadang lambat/timeout: ulangi beberapa kali.
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get $APT_OPTS update -qq &&
               timeout 900 sudo apt-get $APT_OPTS install -y -qq g++-mingw-w64-x86-64 zip; then
              break
            fi
            echo "::warning::apt mingw-w64 percobaan $attempt gagal, ulangi"
            sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock || true
            sleep 10
          done
          if ! command -v x86_64-w64-mingw32-g++ >/dev/null; then
            # Toolchain host tidak tersedia (bukan salah kode). Job Release tetap
            # meng-compile DLL/EXE host, jadi gate cukup memberi peringatan.
            echo "::warning::mingw-w64 tidak tersedia di runner; gate host C++ dilewati (diuji di job Release)"
            exit 0
          fi
          mkdir -p /tmp/dist-host
          x86_64-w64-mingw32-g++ -std=c++17 -O2 -shared \
            host-agent/src/xydesk_quic.cpp -Ihost-agent/include \
            -o /tmp/dist-host/xydesk_quic.dll \
            -Wl,--out-implib,/tmp/dist-host/libxydesk_quic.a \
            -static-libgcc -static-libstdc++ -Wl,-Bstatic -lstdc++ -lpthread -Wl,-Bdynamic \
            -lws2_32 -lole32
          x86_64-w64-mingw32-g++ -std=c++17 -O2 -shared \
            host-agent/src/xydesk_host_core.cpp -Ihost-agent/include \
            -o /tmp/dist-host/xydesk_host_core.dll \
            -Wl,--out-implib,/tmp/dist-host/libxydesk_host_core.a \
            -static-libgcc -static-libstdc++ -Wl,-Bstatic -lstdc++ -lpthread -Wl,-Bdynamic \
            -lws2_32 -ldxgi -ladvapi32 -liphlpapi -luser32 -lgdi32
          x86_64-w64-mingw32-g++ -std=c++17 -O2 \
            host-agent/src/main_host.cpp -Ihost-agent/include \
            -L/tmp/dist-host -lxydesk_quic -lxydesk_host_core \
            -o /tmp/dist-host/XyDeskRemoteHost.exe \
            -static-libgcc -static-libstdc++ -Wl,-Bstatic -lstdc++ -lpthread -Wl,-Bdynamic -luser32 -lgdi32 -lshell32 -lwtsapi32
          # Exe tunggal mandiri: kedua pustaka dikompilasi langsung ke dalam exe
          # dan runtime mingw diikat statis, jadi hasilnya tidak membutuhkan
          # xydesk_quic.dll, xydesk_host_core.dll, maupun DLL runtime mingw.
          # Exe lama yang bergantung DLL tetap dibangun supaya tidak ada yang
          # rusak sebelum exe tunggal ini terbukti di perangkat nyata.
          # Dua makro *_EXPORTS wajib ada di sini. CMake mendefinisikannya
          # otomatis untuk target SHARED (xydesk_quic, xydesk_host_core), tapi
          # build tunggal ini tidak lewat CMake: tanpa keduanya header memilih
          # __declspec(dllimport) dan linker gagal dengan
          # "undefined reference to __imp_xydesk_host_inspect_system".
          x86_64-w64-mingw32-g++ -std=c++17 -O2 \
            -DXYDESK_QUIC_EXPORTS -DXYDESK_HOST_CORE_EXPORTS \
            host-agent/src/main_host.cpp \
            host-agent/src/xydesk_quic.cpp \
            host-agent/src/xydesk_host_core.cpp \
            -Ihost-agent/include \
            -o "/tmp/dist-host/XyDeskRemoteHost-Standalone.exe" \
            -static -static-libgcc -static-libstdc++ \
            -lws2_32 -lole32 -ldxgi -ladvapi32 -liphlpapi -luser32 -lgdi32 -lshell32 -lwtsapi32
          ls -lh /tmp/dist-host/

  # ------------------------------------------------------------------
  # DEBUG per-ABI (tiap push ke main; commit [skip-debug] khusus melewati job ini)
  # ------------------------------------------------------------------
  build-debug:
    if: ${{ (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && !contains(github.event.head_commit.message, '[skip-debug]')) || (github.event_name == 'workflow_dispatch' && inputs.job == 'debug') }}
    name: Debug per-ABI (armv7 + arm64 + x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Lewati kalau commit ini sudah punya tag rilis
        id: tagcheck
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if git ls-remote --tags origin | awk -v s="$GITHUB_SHA" '$1 == s { found = 1 } END { exit !found }'; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$GITHUB_SHA sudah bertag — run rilis di sha ini yang dipakai, debug dilewati."
          fi
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          # Cache dependensi + wrapper Gradle antar-run (permintaan pemilik
          # 2026-10-10: build harus lebih cepat, cache yang penting disimpan).
          cache: gradle
        if: steps.tagcheck.outputs.tagged != 'true'
      - name: Cache Android SDK (NDK & CMake)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: steps.tagcheck.outputs.tagged != 'true'
        with:
          path: |
            $HOME/android-sdk/ndk/29.0.13113456
            $HOME/android-sdk/cmake/4.1.2
          key: android-ndk-29.0.13113456-cmake-4.1.2
      - name: Install Android SDK (cmdline-tools + components)
        if: steps.tagcheck.outputs.tagged != 'true'
        run: |
          set -eux
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/clt.zip
          unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-37.2" "build-tools;37.0.0" \
            "cmake;4.1.2" "ndk;29.0.13113456"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          # runner punya ANDROID_SDK_ROOT bawaan — samakan agar AGP tidak gagal
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Host dependencies (pkg-config + nasm)
        if: steps.tagcheck.outputs.tagged != 'true'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 -o Acquire::ForceIPv4=true"
          sudo apt-get $APT_OPTS update -qq
          # pkg-config: disyaratkan ExternalFreeRDP.cmake
          # nasm: OpenH264 mem-compile cpuid.asm untuk target x86/x86_64
          timeout 600 sudo apt-get $APT_OPTS install -y -qq pkg-config nasm
      - name: Unit test JVM (core-rdp + core-pc-stream)
        if: steps.tagcheck.outputs.tagged != 'true'
        working-directory: client/Android/Studio
        run: ./gradlew --stacktrace --no-daemon --build-cache :core-rdp:testDebugUnitTest :core-pc-stream:testDebugUnitTest
      - name: Gradle assembleDebug (per ABI)
        if: steps.tagcheck.outputs.tagged != 'true'
        working-directory: client/Android/Studio
        run: ./gradlew --stacktrace --no-daemon --build-cache assembleDebug
      - name: List build outputs
        if: steps.tagcheck.outputs.tagged != 'true'
        working-directory: client/Android/Studio
        run: find app/build/outputs -name "*.apk" -exec ls -lh {} \;
      - name: Upload debug APKs (per ABI)
        if: steps.tagcheck.outputs.tagged != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xydesk-remote-debug-per-abi
          path: client/Android/Studio/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  # ------------------------------------------------------------------
  # RELEASE per-ABI (R8 + signing resmi) + GitHub Release
  # Trigger: tag v* (otomatis) atau manual 'release'
  # ------------------------------------------------------------------
  build-release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.job == 'release' && github.ref == 'refs/heads/main') }}
    name: Release per-ABI (R8 + signed) + GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 400
    # Build/signing hanya memerlukan baca; publikasi dipisah ke job sempit.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Ensure release tag points to a commit on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::Release tags must point to a commit reachable from main."
            exit 1
          fi
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          # Cache dependensi + wrapper Gradle antar-run (permintaan pemilik
          # 2026-10-10: build harus lebih cepat, cache yang penting disimpan).
          cache: gradle
      - name: Cache Android SDK (NDK & CMake)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            $HOME/android-sdk/ndk/29.0.13113456
            $HOME/android-sdk/cmake/4.1.2
          key: android-ndk-29.0.13113456-cmake-4.1.2
      - name: Cache FreeRDP Native CMake Superbuild (.cxx)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            client/Android/Studio/freeRDPCore/.cxx
            client/Android/Studio/freeRDPCore/src/main/cpp/external
            $HOME/.gradle/caches
          key: freerdp-native-cxx-v2-${{ hashFiles('client/Android/cmake/**', 'client/Android/Studio/freeRDPCore/src/main/cpp/**', 'channels/rdpsnd/**', 'channels/disp/**', 'channels/client/**', 'channels/cliprdr/**', 'client/common/**', 'libfreerdp/codec/**') }}
          restore-keys: |
            freerdp-native-cxx-v2-
      # Cache .cxx dan source ExternalProject harus selalu sepasang. Kalau .cxx
      # dipulihkan tanpa source-nya (mis. cache lama dari sebelum path external
      # ikut di-cache), step update openh264 gagal dengan
      # "fatal: not a git repository". Lebih baik build ulang dari nol.
      - name: Buang cache native bila source ExternalProject tidak ikut terpulihkan
        run: |
          EXT="client/Android/Studio/freeRDPCore/src/main/cpp/external"
          if [ -d "client/Android/Studio/freeRDPCore/.cxx" ] && [ ! -d "$EXT/openh264/.git" ]; then
            echo "Cache .cxx tanpa source ExternalProject -> bersihkan agar superbuild jalan dari nol."
            rm -rf client/Android/Studio/freeRDPCore/.cxx
          fi
      # Cache native memuat pohon sumber FreeRDP dan ExternalProject SETELAH
      # patch diterapkan di tempat, sementara langkah di bawah menghapus stamp
      # supaya build+install selalu diulang — termasuk langkah patch-nya. Pada
      # cache-hit pertama (run 37539620195, rilis v1.1.0) git menolak dengan
      # "error: build/platform-android.mk: does not match index" karena working
      # tree sudah tidak cocok lagi dengan indeks. Kembalikan tiap repo ke
      # keadaan pristine supaya patch diterapkan ulang dengan bersih, persis
      # seperti jalur cache-miss yang selama ini berhasil.
      - name: Segarkan repo git di cache native agar patch bisa diterapkan ulang
        run: |
          set -uo pipefail
          for root in \
            client/Android/Studio/freeRDPCore/.cxx \
            client/Android/Studio/freeRDPCore/src/main/cpp/external
          do
            [ -d "$root" ] || continue
            while IFS= read -r gitdir; do
              repo="${gitdir%/.git}"
              git -C "$repo" checkout -q -- . 2>/dev/null || true
              git -C "$repo" clean -fdq 2>/dev/null || true
              echo "  pristine: $repo"
            done < <(find "$root" -maxdepth 10 -name .git -print 2>/dev/null)
          done
      - name: Invalidate FreeRDP stamp so patched C files always rebuild & install
        run: |
          if [ -d "client/Android/Studio/freeRDPCore/.cxx" ]; then
            find client/Android/Studio/freeRDPCore/.cxx -path "*freerdp-stamp/freerdp-build*" -delete || true
            find client/Android/Studio/freeRDPCore/.cxx -path "*freerdp-stamp/freerdp-install*" -delete || true
          fi
      - name: Install Android SDK (cmdline-tools + components)
        run: |
          set -eux
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/clt.zip
          unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-37.2" "build-tools;37.0.0" \
            "cmake;4.1.2" "ndk;29.0.13113456"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Host dependencies (pkg-config + nasm + mingw-w64)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 -o Acquire::ForceIPv4=true"
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get $APT_OPTS update -qq &&
               timeout 1200 sudo apt-get $APT_OPTS install -y -qq pkg-config nasm g++-mingw-w64-x86-64 zip; then
              break
            fi
            echo "::warning::apt host deps percobaan $attempt gagal, ulangi"
            sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock || true
            sleep 10
          done
          x86_64-w64-mingw32-g++ --version | head -n 1
          nasm -v
      - name: Restore release keystore dari secret
        env:
          RELEASE_KEY_BASE64: ${{ secrets.RELEASE_KEY_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEY_BASE64" ] || [ -z "$RELEASE_KEY_ALIAS" ] || \
             [ -z "$RELEASE_KEY_PASSWORD" ] || [ -z "$RELEASE_STORE_PASSWORD" ]; then
            echo "::error::Secret signing release belum lengkap. Siapkan keystore di mesin tepercaya dan periksa secrets signing yang diwajibkan."
            exit 1
          fi
          umask 077
          printf '%s' "$RELEASE_KEY_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.keystore"
          test -s "$GITHUB_WORKSPACE/release.keystore"
      # Fail cepat: kalau Kotlin tidak compile, batalkan SEBELUM membangun
      # native (dulu: 23 menit native dulu, baru ketahuan error Kotlin).
      - name: "Gate: compileReleaseKotlin sebelum build native"
        working-directory: client/Android/Studio
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: ./gradlew --stacktrace --no-daemon --build-cache :app:compileReleaseKotlin
      - name: Gradle assembleRelease (R8 + signed, per ABI)
        working-directory: client/Android/Studio
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: ./gradlew --stacktrace --no-daemon --build-cache assembleRelease
      - name: Namai APK berdasarkan ABI Android
        working-directory: client/Android/Studio/app/build/outputs/apk/release
        run: |
          set -euo pipefail
          mv app-armeabi-v7a-release.apk XyDesk-Remote-armeabi-v7a.apk
          mv app-arm64-v8a-release.apk XyDesk-Remote-arm64-v8a.apk
          mv app-x86_64-release.apk XyDesk-Remote-x86_64.apk
          ls -lh XyDesk-Remote-*.apk
      - name: Tanda tangani ulang APK dengan skema V1 + V2 (deterministik)
        # AGP 9 mematikan v1 (JAR) saat minSdk >= 24 dan setelan enableV1Signing
        # di build.gradle tidak cukup. Re-sign di sini memakai keystore yang sama,
        # jadi verifier pihak ketiga (mis. MT Manager) tetap melihat sertifikat
        # yang identik dengan rilis v1.0.2.
        working-directory: client/Android/Studio/app/build/outputs/apk/release
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          APK_SIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          for abi in armeabi-v7a arm64-v8a x86_64; do
            apk="XyDesk-Remote-$abi.apk"
            if [ ! -s "$apk" ]; then
              echo "::error::$apk tidak ditemukan untuk ditandatangani ulang."
              exit 1
            fi
            "$APK_SIGNER" sign \
              --ks "$RELEASE_STORE_FILE" \
              --ks-key-alias "$RELEASE_KEY_ALIAS" \
              --ks-pass "env:RELEASE_STORE_PASSWORD" \
              --key-pass "env:RELEASE_KEY_PASSWORD" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled false \
              --v4-signing-enabled false \
              --out "$apk.resigned" "$apk"
            mv "$apk.resigned" "$apk"
            # Bukti blok V1/JAR: jarsigner memverifikasi META-INF langsung.
            # (apksigner verify biasa melaporkan v1=false untuk APK minSdk 24+
            # walau blok V1 ada, karena platform mengabaikan V1 mulai API 24.)
            if ! "$JAVA_HOME/bin/jarsigner" -verify -certs "$apk" > "/tmp/jarsigner-$abi.txt" 2>&1; then
              cat "/tmp/jarsigner-$abi.txt"
              echo "::error::APK $abi tidak memiliki tanda tangan V1/JAR yang valid."
              exit 1
            fi
            echo "V1/JAR $abi: $(tail -1 "/tmp/jarsigner-$abi.txt")"
          done
          ls -lh XyDesk-Remote-*.apk
      - name: Verifikasi V1/V2, semua ABI, dan signer yang sama dengan v1.0.2
        working-directory: client/Android/Studio
        run: |
          set -euo pipefail
          APK_SIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          OUT="app/build/outputs/apk/release"
          BASELINE_DIR="$(mktemp -d)"
          REPORT="$OUT/SIGNATURE-VERIFICATION.txt"
          trap 'rm -rf "$BASELINE_DIR"' EXIT
          baseline_cert=""

          release_tag="${GITHUB_REF_NAME:-}"
          if [[ "$release_tag" != v* ]]; then
            release_version="$(sed -n 's/^VERSION_NAME=//p' release.properties)"
            release_tag="v${release_version}"
          fi

          {
            echo "XyDesk Remote — APK signer verification"
            echo "All v1.0.2 public ABI assets are checked against their published SHA-256."
            echo "All ${release_tag} APKs must verify with V1 + V2 and retain the same signer."
            echo "V1/JAR diuji dengan --min-sdk-version 23: untuk APK minSdk 24+ apksigner"
            echo "melaporkan v1=false walau blok JAR ada, karena platform mengabaikan V1."
            echo
          } > "$REPORT"

          # Cek file persis yang ada di rilis publik v1.0.2, termasuk armv7 yang
          # dilaporkan MT Manager. Baseline hash diambil dari digest GitHub Releases.
          baseline_entries=(
            "armeabi-v7a|https://github.com/xykal/XyDesk-Remote/releases/download/v1.0.2/XyDesk-armeabi-v7a.apk|ebf796a5e1f20b789a2beeda29e8769949ed9793ebce5e4fb6cec2a20f5e02b4"
            "arm64-v8a|https://github.com/xykal/XyDesk-Remote/releases/download/v1.0.2/XyDesk-arm64-v8a.apk|dad982b13f4c9c42926caf04fb6c5a9ad14cd877c9b9bf90ee5ff93b09f5041d"
            "x86_64|https://github.com/xykal/XyDesk-Remote/releases/download/v1.0.2/XyDesk-x86_64.apk|4f1a0d3d5de6caa9b2f445269c6e94ba8f07d927f4399e9d30f240fde2908979"
          )
          for entry in "${baseline_entries[@]}"; do
            IFS='|' read -r abi url expected_sha <<< "$entry"
            apk="$BASELINE_DIR/v1.0.2-$abi.apk"
            curl --fail --location --retry 3 --retry-delay 2 --silent --show-error "$url" --output "$apk"
            actual_sha="$(sha256sum "$apk" | awk '{print $1}')"
            if [ "$actual_sha" != "$expected_sha" ]; then
              echo "::error::Hash baseline v1.0.2 $abi tidak cocok dengan digest rilis GitHub."
              exit 1
            fi
            set +e
            baseline_output="$("$APK_SIGNER" verify --verbose --print-certs "$apk" 2>&1)"
            verify_status=$?
            set -e
            printf '%s\n' "--- baseline v1.0.2 $abi (apksigner exit $verify_status) ---" "$baseline_output"
            baseline_v1="false"
            baseline_v2="false"
            grep -Fq 'Verified using v1 scheme (JAR signing): true' <<<"$baseline_output" && baseline_v1="true"
            grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' <<<"$baseline_output" && baseline_v2="true"
            if [ "$baseline_v2" != "true" ]; then
              echo "::error::Baseline v1.0.2 $abi tidak lolos verifikasi V2."
              exit 1
            fi
            if ! grep -Fq 'Number of signers: 1' <<<"$baseline_output"; then
              echo "::error::Baseline v1.0.2 $abi harus memiliki tepat satu signer."
              exit 1
            fi
            # apksigner mencetak "V2 Signer: certificate SHA-256 digest: ..." pada
            # versi build-tools baru dan "Signer #1 certificate ..." pada versi lama.
            # Ambil baris mana pun yang memuat sertifikat SHA-256, lalu bersihkan
            # jadi hex 64 karakter agar perbandingan signer tetap valid.
            cert="$(printf '%s\n' "$baseline_output" | awk -F': *' '/certificate SHA-256 digest:/ { gsub(/[^0-9a-fA-F]/, "", $NF); print tolower($NF); exit }')"
            if [ -z "$cert" ]; then
              echo "::error::Tidak dapat membaca signer certificate dari baseline $abi."
              exit 1
            fi
            if [ -z "$baseline_cert" ]; then
              baseline_cert="$cert"
            elif [ "$cert" != "$baseline_cert" ]; then
              echo "::error::Sertifikat v1.0.2 berbeda antar-ABI."
              exit 1
            fi
            printf '%s v1.0.2: apksigner-exit=%s, V1=%s, V2=%s, SHA-256=%s\n' \
              "$abi" "$verify_status" "$baseline_v1" "$baseline_v2" "$actual_sha" >> "$REPORT"
          done
          printf 'Baseline signer SHA-256: %s\n\n' "$baseline_cert" >> "$REPORT"

          for abi in armeabi-v7a arm64-v8a x86_64; do
            apk="$OUT/XyDesk-Remote-$abi.apk"
            if [ ! -s "$apk" ]; then
              echo "::error::APK untuk ABI $abi tidak ditemukan."
              exit 1
            fi
            verification="$("$APK_SIGNER" verify --verbose --print-certs "$apk")"
            # Untuk V1, verifikasi harus diminta terhadap perangkat yang memang
            # memakai skema JAR (minSdk < 24); kalau tidak, apksigner melaporkan
            # v1=false walau blok V1-nya ada dan valid.
            v1_verification="$("$APK_SIGNER" verify --verbose --min-sdk-version 23 "$apk")"
            printf '%s\n' "--- ${release_tag} $abi (verify utama) ---" "$verification" \
              "--- ${release_tag} $abi (uji V1/JAR, min-sdk 23) ---" "$v1_verification"
            if ! grep -Fq 'Verified using v1 scheme (JAR signing): true' <<<"$v1_verification"; then
              echo "::error::APK $abi tidak lolos verifikasi V1/JAR."
              exit 1
            fi
            if ! grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' <<<"$verification"; then
              echo "::error::APK $abi tidak lolos verifikasi V2."
              exit 1
            fi
            if ! grep -Fq 'Number of signers: 1' <<<"$verification"; then
              echo "::error::APK $abi harus memiliki tepat satu signer."
              exit 1
            fi
            cert="$(printf '%s\n' "$verification" | awk -F': *' '/certificate SHA-256 digest:/ { gsub(/[^0-9a-fA-F]/, "", $NF); print tolower($NF); exit }')"
            if [ -z "$cert" ] || [ "$cert" != "$baseline_cert" ]; then
              echo "::error::Signer $abi tidak sama dengan sertifikat v1.0.2."
              exit 1
            fi
            apk_sha="$(sha256sum "$apk" | awk '{print $1}')"
            printf '%s %s: PASS (V1 teruji min-sdk 23 + V2)\n  APK SHA-256: %s\n  Signer SHA-256: %s\n\n' \
              "$abi" "$release_tag" "$apk_sha" "$cert" >> "$REPORT"
          done
          cat "$REPORT"
      - name: Nama akhir APK untuk user (32bit/64bit)
        working-directory: client/Android/Studio/app/build/outputs/apk/release
        run: |
          set -euo pipefail
          # Nama internal per-ABI dipakai sampai verifikasi tanda tangan selesai;
          # nama yang dipublikasikan mengikuti bit arsitektur yang mudah dipahami.
          mv XyDesk-Remote-armeabi-v7a.apk XyDesk-Remote32bit.apk
          mv XyDesk-Remote-arm64-v8a.apk XyDesk-Remote64bit.apk
          mv XyDesk-Remote-x86_64.apk XyDesk-Remote64bit-x86.apk
          ls -lh XyDesk-Remote*.apk
      # Skrip ini sudah ada sejak v1.0.6 tetapi belum pernah dipanggil workflow.
      # Fungsinya: pastikan tiap APK adalah ZIP utuh dan memuat libcrypto.so ABI-nya.
      - name: Verifikasi integritas ZIP & libcrypto per ABI
        working-directory: client/Android/Studio
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/ci/verify_android_apks.py" \
            app/build/outputs/apk/release/XyDesk-Remote32bit.apk \
            app/build/outputs/apk/release/XyDesk-Remote64bit.apk \
            app/build/outputs/apk/release/XyDesk-Remote64bit-x86.apk
      - name: Build Windows Native C++17 Host Agent & DLLs (xydesk_quic.dll + xydesk_host_core.dll + XyDeskRemoteHost.exe)
        run: |
          set -euo pipefail
          OUT_DIR="client/Android/Studio/app/build/outputs/apk/release"
          STAGE_DIR="/tmp/xydesk-host-win64"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR" "$OUT_DIR"
          x86_64-w64-mingw32-g++ -std=c++17 -O2 -shared \
            host-agent/src/xydesk_quic.cpp -Ihost-agent/include \
            -o "$STAGE_DIR/xydesk_quic.dll" \
            -Wl,--out-implib,"$STAGE_DIR/libxydesk_quic.a" \
            -static-libgcc -static-libstdc++ -Wl,-Bstatic -lstdc++ -lpthread -Wl,-Bdynamic \
            -lws2_32 -lole32
          x86_64-w64-mingw32-g++ -std=c++17 -O2 -shared \
            host-agent/src/xydesk_host_core.cpp -Ihost-agent/include \
            -o "$STAGE_DIR/xydesk_host_core.dll" \
            -Wl,--out-implib,"$STAGE_DIR/libxydesk_host_core.a" \
            -static-libgcc -static-libstdc++ -Wl,-Bstatic -lstdc++ -lpthread -Wl,-Bdynamic \
            -lws2_32 -ldxgi -ladvapi32 -liphlpapi -luser32 -lgdi32
          x86_64-w64-mingw32-g++ -std=c++17 -O2 \
            host-agent/src/main_host.cpp -Ihost-agent/include \
            -L"$STAGE_DIR" -lxydesk_quic -lxydesk_host_core \
            -o "$STAGE_DIR/XyDeskRemoteHost.exe" \
            -static-libgcc -static-libstdc++ -Wl,-Bstatic -lstdc++ -lpthread -Wl,-Bdynamic -luser32 -lgdi32 -lshell32 -lwtsapi32
          # Exe tunggal mandiri: kedua pustaka dikompilasi langsung ke dalam exe
          # dan runtime mingw diikat statis, jadi hasilnya tidak membutuhkan
          # xydesk_quic.dll, xydesk_host_core.dll, maupun DLL runtime mingw.
          # Exe lama yang bergantung DLL tetap dibangun supaya tidak ada yang
          # rusak sebelum exe tunggal ini terbukti di perangkat nyata.
          # Dua makro *_EXPORTS wajib ada di sini. CMake mendefinisikannya
          # otomatis untuk target SHARED (xydesk_quic, xydesk_host_core), tapi
          # build tunggal ini tidak lewat CMake: tanpa keduanya header memilih
          # __declspec(dllimport) dan linker gagal dengan
          # "undefined reference to __imp_xydesk_host_inspect_system".
          x86_64-w64-mingw32-g++ -std=c++17 -O2 \
            -DXYDESK_QUIC_EXPORTS -DXYDESK_HOST_CORE_EXPORTS \
            host-agent/src/main_host.cpp \
            host-agent/src/xydesk_quic.cpp \
            host-agent/src/xydesk_host_core.cpp \
            -Ihost-agent/include \
            -o "$STAGE_DIR/XyDeskRemoteHost-Standalone.exe" \
            -static -static-libgcc -static-libstdc++ \
            -lws2_32 -lole32 -ldxgi -ladvapi32 -liphlpapi -luser32 -lgdi32 -lshell32 -lwtsapi32
          rm -f "$STAGE_DIR"/*.a
          cp web/XyDeskHost-Setup.bat "$STAGE_DIR/XyDeskHost-Setup.bat"
          cp web/XyDesk-Remote-Agent-Setup.ps1 "$STAGE_DIR/XyDesk-Remote-Agent-Setup.ps1"
          cp "$STAGE_DIR/xydesk_quic.dll" "$OUT_DIR/xydesk_quic.dll"
          cp "$STAGE_DIR/xydesk_host_core.dll" "$OUT_DIR/xydesk_host_core.dll"
          cp "$STAGE_DIR/XyDeskRemoteHost.exe" "$OUT_DIR/XyDeskRemoteHost.exe"
          cp "$STAGE_DIR/XyDeskRemoteHost-Standalone.exe" "$OUT_DIR/XyDeskRemoteHost-Standalone.exe"
          (cd "$STAGE_DIR" && zip -q -r "$GITHUB_WORKSPACE/$OUT_DIR/XyDesk-Remote-Host-Agent-win64.zip" .)
          ls -lh "$OUT_DIR"
      - name: Upload signed APKs & Windows Host Agent for publishing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xydesk-remote-release-apks
          path: |
            client/Android/Studio/app/build/outputs/apk/release/*.apk
            client/Android/Studio/app/build/outputs/apk/release/XyDesk-Remote-Host-Agent-win64.zip
            client/Android/Studio/app/build/outputs/apk/release/XyDeskRemoteHost.exe
            client/Android/Studio/app/build/outputs/apk/release/XyDeskRemoteHost-Standalone.exe
            client/Android/Studio/app/build/outputs/apk/release/xydesk_quic.dll
            client/Android/Studio/app/build/outputs/apk/release/xydesk_host_core.dll
            client/Android/Studio/app/build/outputs/apk/release/SIGNATURE-VERIFICATION.txt
          retention-days: 3
      - name: Hapus material signing sementara
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/release.keystore"

  # Token write hanya tersedia pada job publikasi; proses build/native tidak
  # mendapat izin membuat atau mengubah GitHub Release.
  publish-release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: build-release
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      # Tanpa checkout ini folder ci/ tidak ada di workspace job publish
      # (job ini tadinya cuma download artifact), jadi skrip verifikasi
      # tidak bisa dijalankan sama sekali.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Download signed APKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: xydesk-remote-release-apks
          path: release-apks
      - name: Buat SHA256SUMS.txt (integritas aset rilis)
        run: |
          cd release-apks
          rm -f SHA256SUMS.txt
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\n' | sort |
            while read -r f; do sha256sum "$f"; done > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # Pastikan tiga sumber kebenaran setuju sebelum aset dipublikasikan:
      # isi APK, SHA256SUMS.txt, dan hash di SIGNATURE-VERIFICATION.txt.
      - name: Verifikasi APK = SHA256SUMS = laporan signer
        run: python3 ci/verify_release_apk_hashes.py release-apks
      - name: Buat GitHub Release (tag v*)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            release-apks/*.apk
            release-apks/XyDesk-Remote-Host-Agent-win64.zip
            release-apks/XyDeskRemoteHost.exe
            release-apks/XyDeskRemoteHost-Standalone.exe
            release-apks/xydesk_quic.dll
            release-apks/xydesk_host_core.dll
            release-apks/SIGNATURE-VERIFICATION.txt
            release-apks/SHA256SUMS.txt
          generate_release_notes: true
          overwrite_files: true
          # Semua tag rilis selalu dibuat sebagai draft untuk diuji pemilik dulu.
          # Publikasi final dilakukan manual setelah APK draft lolos tes perangkat.
          draft: true
      - name: Bersihkan cache, artifacts, dan output sementara Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          # Draft release dan tag bukan Actions artifacts; pertahankan keduanya,
          # juga log/riwayat run untuk audit. Hapus hanya cache/artifact sementara.
          for art_id in $(gh api --paginate "repos/$repo/actions/artifacts" -q '.artifacts[].id'); do
            gh api -X DELETE "repos/$repo/actions/artifacts/$art_id" </dev/null >/dev/null || true
          done
          for cache_id in $(gh api --paginate "repos/$repo/actions/caches" -q '.actions_caches[].id'); do
            gh api -X DELETE "repos/$repo/actions/caches/$cache_id" </dev/null >/dev/null || true
          done
          rm -rf release-apks
