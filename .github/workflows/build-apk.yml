name: Build APK

# Builds the XyDesk Remote APK from the Gradle project at
# client/Android/Studio. The FreeRDP superbuild (OpenSSL, FFmpeg,
# OpenH264, Opus, FreeRDP core) runs inside the CMake step — first
# build on a clean runner takes ~45-75 minutes; re-runs are faster
# thanks to the NDK/CMake cache below.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  GRADLE_PROJECT_DIR: client/Android/Studio

jobs:
  build:
    name: Assemble debug APK (arm64-v8a + x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Android SDK (NDK & CMake)
        uses: actions/cache@v5
        with:
          path: |
            $HOME/android-sdk/ndk/29.0.13113456
            $HOME/android-sdk/cmake/4.1.2
          key: android-ndk-29.0.13113456-cmake-4.1.2

      - name: Install Android SDK (cmdline-tools + components)
        run: |
          set -eux
          # ubuntu-latest no longer ships the Android SDK — install it
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/clt.zip
          unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;37.0.0" \
            "cmake;4.1.2" "ndk;29.0.13113456"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          # runner juga punya ANDROID_SDK_ROOT bawaan (SDK lama di /usr/local/lib) —
          # samakan path-nya agar AGP tidak gagal karena "multiple SDK paths"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Host dependencies (pkg-config needed by FreeRDP superbuild)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config

      - name: Gradle assembleDebug
        working-directory: client/Android/Studio
        run: ./gradlew --stacktrace --no-daemon assembleDebug

      - name: List build outputs
        working-directory: client/Android/Studio
        run: |
          echo "== APKs =="
          find app/build/outputs -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xydesk-remote-debug
          path: client/Android/Studio/app/build/outputs/apk/**/*.apk
