name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Ketik DEPLOY untuk memperbarui Worker produksi rdp.xydesk.my.id"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY' }}
    name: Deploy Worker produksi (manual)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Pastikan kredensial Cloudflare tersedia
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Tambahkan CLOUDFLARE_API_TOKEN dan CLOUDFLARE_ACCOUNT_ID sebagai GitHub Actions secrets terlebih dahulu."
            exit 1
          fi
      - name: Deploy Worker dan migrasi Durable Objects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
