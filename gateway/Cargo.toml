[package]
name = "xydesk-rdp-gateway"
version = "0.1.0"
edition = "2021"
description = "Gateway RDP web XyDesk Remote — token terenkripsi (HMAC+AES) + jembatan WebSocket ↔ guacd"
license = "Apache-2.0"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
futures-util = "0.3"

[profile.release]
lto = true
strip = true
